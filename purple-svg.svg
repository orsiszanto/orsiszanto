<svg width="100%" height="3" viewBox="0 0 1200 3" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <style>
    @keyframes slowGlow {
      0%, 100% {
        opacity: 0.35;
      }
      50% {
        opacity: 1;
      }
    }
    .pulsing-line {
      animation: slowGlow 4s ease-in-out infinite;
    }
  </style>
  <defs>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#8A2BE2" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E9D5FF" stop-opacity="1" />
      <stop offset="70%" stop-color="#8A2BE2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect class="pulsing-line" width="100%" height="3" fill="url(#purple-glow)"/>
</svg>
